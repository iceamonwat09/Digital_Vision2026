{% extends "base.html" %}

{% block title %}ตรวจจับสด - Thai Union Can Inspector{% endblock %}

{% block content %}
<div class="container">
    <div class="page-header-compact">
        <h2>Live Defect Detection</h2>
        <div class="detection-controls-compact">
            <div class="control-group">

                <!-- Inspection mode tabs -->
                <div class="src-tabs" id="modeTabs">
                    <!-- populated from /api/modes -->
                </div>

                <!-- Model file picker (per-mode) -->
                <div class="camera-select-group">
                    <select id="modelSelect" class="camera-select" title="เลือกไฟล์โมเดล (.pt)">
                        <option value="" disabled selected>Loading models…</option>
                    </select>
                    <button id="refreshModelsBtn" class="btn btn-icon" title="รีเฟรชรายการโมเดล">&#x1F504;</button>
                </div>

                <!-- Source type tabs -->
                <div class="src-tabs">
                    <button id="tabUsb"  class="src-tab src-tab-active" onclick="switchSource('usb')">กล้อง USB</button>
                    <button id="tabRtsp" class="src-tab" onclick="switchSource('rtsp')">กล้อง IP (RTSP)</button>
                </div>

                <!-- USB panel -->
                <div id="panelUsb" class="camera-panel">
                    <div class="camera-select-group">
                        <select id="cameraSelect" class="camera-select" title="Select camera">
                            <option value="" disabled selected>Loading cameras…</option>
                        </select>
                        <button id="refreshCamerasBtn" class="btn btn-icon" title="Refresh">&#x1F504;</button>
                    </div>
                </div>

                <!-- RTSP panel -->
                <div id="panelRtsp" class="camera-panel" style="display:none">
                    <div class="rtsp-input-group">
                        <input id="rtspUrl" type="text" class="rtsp-input"
                               placeholder="rtsp://user:pass@192.168.x.x:554/stream"
                               title="RTSP URL">
                        <button class="btn btn-icon" onclick="saveRtsp()" title="บันทึก URL">&#x1F4BE;</button>
                    </div>
                </div>

                <button id="startBtn" class="btn btn-primary">Start Detection</button>
                <button id="stopBtn" class="btn btn-danger" disabled>Stop Detection</button>
            </div>
            <div class="status-indicator">
                <span id="statusDot" class="status-dot status-inactive"></span>
                <span id="statusText">Inactive</span>
            </div>
        </div>
    </div>

    <div class="detection-layout">
        <div class="video-container-compact">
            <div class="video-wrapper-compact">
                <img id="videoStream" src="{{ url_for('video_feed') }}" alt="Video Stream">
            </div>
        </div>

        <div class="stats-panel-compact">
            <div class="stat-card-compact">
                <div class="stat-label">Active Defects</div>
                <div class="stat-value-compact" id="activeDefects">0</div>
            </div>
            <div class="stat-card-compact">
                <div class="stat-label">Total Detected</div>
                <div class="stat-value-compact" id="totalDetected">0</div>
            </div>
            <div class="stat-card-compact">
                <div class="stat-label">Detection Status</div>
                <div class="stat-value-compact" id="detectionStatus">Ready</div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const startBtn        = document.getElementById('startBtn');
    const stopBtn         = document.getElementById('stopBtn');
    const statusDot       = document.getElementById('statusDot');
    const statusText      = document.getElementById('statusText');
    const activeDefects   = document.getElementById('activeDefects');
    const totalDetected   = document.getElementById('totalDetected');
    const detectionStatus = document.getElementById('detectionStatus');
    const cameraSelect    = document.getElementById('cameraSelect');
    const refreshCamerasBtn = document.getElementById('refreshCamerasBtn');
    const rtspUrlInput    = document.getElementById('rtspUrl');
    const modeTabs       = document.getElementById('modeTabs');
    const modelSelect    = document.getElementById('modelSelect');
    const refreshModelsBtn = document.getElementById('refreshModelsBtn');

    let statusCheckInterval = null;
    let currentSource = 'usb';   // 'usb' | 'rtsp'
    let currentMode  = null;     // populated from /api/modes

    // ── Source tab switching ──────────────────────────
    window.switchSource = function(src) {
        currentSource = src;
        document.getElementById('panelUsb').style.display  = src === 'usb'  ? '' : 'none';
        document.getElementById('panelRtsp').style.display = src === 'rtsp' ? '' : 'none';
        document.getElementById('tabUsb').classList.toggle('src-tab-active',  src === 'usb');
        document.getElementById('tabRtsp').classList.toggle('src-tab-active', src === 'rtsp');
    };

    window.saveRtsp = function() {
        const url = rtspUrlInput.value.trim();
        if (url) {
            localStorage.setItem('rtspUrl', url);
            rtspUrlInput.style.borderColor = 'var(--success)';
            setTimeout(() => rtspUrlInput.style.borderColor = '', 1500);
        }
    };

    // Restore saved RTSP URL
    const savedRtsp = localStorage.getItem('rtspUrl');
    if (savedRtsp) rtspUrlInput.value = savedRtsp;

    // ── Camera scanning (USB only) ────────────────────
    function scanCameras() {
        cameraSelect.disabled = true;
        cameraSelect.innerHTML = '<option value="" disabled selected>Scanning…</option>';
        refreshCamerasBtn.disabled = true;

        fetch('/api/camera/scan')
            .then(r => r.json())
            .then(data => {
                cameraSelect.innerHTML = '';
                if (data.cameras && data.cameras.length > 0) {
                    data.cameras.forEach(cam => {
                        const opt = document.createElement('option');
                        opt.value = cam.id;
                        opt.textContent = cam.name;
                        cameraSelect.appendChild(opt);
                    });
                    cameraSelect.disabled = false;
                } else {
                    cameraSelect.innerHTML = '<option value="" disabled selected>ไม่พบกล้อง</option>';
                }
            })
            .catch(() => {
                cameraSelect.innerHTML = '<option value="" disabled selected>Scan failed</option>';
            })
            .finally(() => { refreshCamerasBtn.disabled = false; });
    }

    refreshCamerasBtn.addEventListener('click', scanCameras);

    // ── Status polling ────────────────────────────────
    function updateStatus() {
        fetch('/api/detection/status')
            .then(r => r.json())
            .then(data => {
                const isActive = data.active;
                statusDot.className = 'status-dot ' + (isActive ? 'status-active' : 'status-inactive');
                statusText.textContent = isActive ? 'Active' : 'Inactive';
                startBtn.disabled  = isActive;
                stopBtn.disabled   = !isActive;
                cameraSelect.disabled      = isActive;
                refreshCamerasBtn.disabled = isActive;
                rtspUrlInput.disabled      = isActive;
                modelSelect.disabled       = isActive || modelSelect.options.length === 0;
                refreshModelsBtn.disabled  = isActive;
                Array.from(modeTabs.children).forEach(b => b.disabled = isActive);

                activeDefects.textContent   = data.stats.current_defects || 0;
                totalDetected.textContent   = data.stats.total_detected  || 0;
                detectionStatus.textContent = isActive ? 'Detecting...' : 'Ready';
            })
            .catch(err => console.error('Status error:', err));
    }

    // ── Start ─────────────────────────────────────────
    startBtn.addEventListener('click', () => {
        let cameraIndex;

        if (currentSource === 'usb') {
            const val = cameraSelect.value;
            if (val === '' || val === null) { alert('กรุณาเลือกกล้องก่อน'); return; }
            cameraIndex = parseInt(val);
        } else {
            const url = rtspUrlInput.value.trim();
            if (!url) { alert('กรุณาใส่ RTSP URL ก่อน'); return; }
            if (!url.match(/^(rtsp|rtsps|rtmp|http|https):\/\//i)) {
                alert('URL ไม่ถูกต้อง ต้องขึ้นต้นด้วย rtsp:// หรือ http://'); return;
            }
            cameraIndex = url;
            localStorage.setItem('rtspUrl', url);
        }

        startBtn.disabled = true;
        detectionStatus.textContent = 'Starting...';

        fetch('/api/detection/start', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ camera_index: cameraIndex })
        })
        .then(r => r.json())
        .then(data => {
            if (data.status === 'error') {
                alert(data.message);
                startBtn.disabled = false;
                detectionStatus.textContent = 'Ready';
                return;
            }
            updateStatus();
            if (!statusCheckInterval) statusCheckInterval = setInterval(updateStatus, 1000);
        })
        .catch(err => {
            console.error('Start error:', err);
            alert('Failed to start detection.');
            startBtn.disabled = false;
            detectionStatus.textContent = 'Ready';
        });
    });

    // ── Stop ──────────────────────────────────────────
    stopBtn.addEventListener('click', () => {
        fetch('/api/detection/stop', { method: 'POST' })
            .then(r => r.json())
            .then(() => updateStatus())
            .catch(err => console.error('Stop error:', err));
    });

    // ── Mode tabs / Model picker ──────────────────────
    function renderModeTabs(modes, active) {
        modeTabs.innerHTML = '';
        modes.forEach(m => {
            const btn = document.createElement('button');
            btn.className = 'src-tab' + (m.name === active ? ' src-tab-active' : '');
            btn.textContent = m.display_name;
            btn.dataset.mode = m.name;
            btn.addEventListener('click', () => switchMode(m.name));
            modeTabs.appendChild(btn);
        });
    }

    function loadModels(mode) {
        modelSelect.disabled = true;
        modelSelect.innerHTML = '<option value="" disabled selected>Loading…</option>';
        refreshModelsBtn.disabled = true;
        return fetch('/api/models?mode=' + encodeURIComponent(mode))
            .then(r => r.json())
            .then(data => {
                modelSelect.innerHTML = '';
                if (!data.models || data.models.length === 0) {
                    modelSelect.innerHTML = '<option value="" disabled selected>ไม่พบไฟล์ .pt</option>';
                    return;
                }
                data.models.forEach(f => {
                    const opt = document.createElement('option');
                    opt.value = f;
                    opt.textContent = f;
                    if (f === data.current) opt.selected = true;
                    modelSelect.appendChild(opt);
                });
                modelSelect.disabled = false;
            })
            .catch(() => {
                modelSelect.innerHTML = '<option value="" disabled selected>โหลดล้มเหลว</option>';
            })
            .finally(() => { refreshModelsBtn.disabled = false; });
    }

    function switchMode(mode) {
        if (mode === currentMode) return;
        // Optimistically update tabs
        Array.from(modeTabs.children).forEach(b =>
            b.classList.toggle('src-tab-active', b.dataset.mode === mode));
        currentMode = mode;
        loadModels(mode).then(() => applyModeOnServer());
    }

    function applyModeOnServer() {
        const file = modelSelect.value || null;
        return fetch('/api/mode/switch', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ mode: currentMode, model_file: file })
        })
        .then(r => r.json())
        .then(data => {
            if (data.status !== 'ok') {
                alert(data.message || 'สลับโหมดไม่สำเร็จ');
            } else if (!data.model_loaded) {
                detectionStatus.textContent = 'No Model';
            }
        })
        .catch(err => {
            console.error('Mode switch error:', err);
            alert('สลับโหมดไม่สำเร็จ');
        });
    }

    function initModes() {
        return fetch('/api/modes')
            .then(r => r.json())
            .then(data => {
                currentMode = data.current;
                renderModeTabs(data.modes, currentMode);
                return loadModels(currentMode);
            })
            .catch(err => {
                console.error('Mode list error:', err);
                modeTabs.innerHTML = '<span style="color:#999">โหลดโหมดไม่ได้</span>';
            });
    }

    modelSelect.addEventListener('change', applyModeOnServer);
    refreshModelsBtn.addEventListener('click', () => {
        if (currentMode) loadModels(currentMode);
    });

    // ── Init ──────────────────────────────────────────
    initModes();
    scanCameras();
    updateStatus();
    statusCheckInterval = setInterval(updateStatus, 1000);
</script>
{% endblock %}
